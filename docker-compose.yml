version: "3.8"

services:

  # ---------------------------
  # BACKEND
  # ---------------------------
  backend:
    build: ./backend
    container_name: backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      - blockchain
      - mongodb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  # ---------------------------
  # FRONTEND
  # ---------------------------
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8080:80"
    networks:
      - app-network

  # ---------------------------
  # BLOCKCHAIN
  # ---------------------------
  blockchain:
    build: ./blockchain
    container_name: blockchain
    ports:
      - "8545:8545"
    networks:
      - app-network

  # ---------------------------
  # MONGODB
  # ---------------------------
  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - app-network

  # ---------------------------
  # ELASTICSEARCH
  # ---------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - app-network

  # ---------------------------
  # LOGSTASH
  # ---------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.1
    container_name: logstash
    volumes:
      - ./backend/logs:/usr/share/logstash/logs
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5001:5000"
    depends_on:
      - elasticsearch
    networks:
      - app-network

  # ---------------------------
  # KIBANA
  # ---------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - app-network

  # ---------------------------
  # PROMETHEUS
  # ---------------------------
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
    networks:
      - app-network

  # ---------------------------
  # GRAFANA
  # ---------------------------
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - app-network

  # ---------------------------
  # CADVISOR
  # ---------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - app-network

# ---------------------------
# NETWORK
# ---------------------------
networks:
  app-network:
    driver: bridge