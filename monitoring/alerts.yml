groups:
  - name: basic-monitoring-alerts
    rules:

      - alert: HighContainerCPU
        expr: sum(rate(container_cpu_usage_seconds_total{name!=""}[5m])) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High container CPU usage"
          description: "Container CPU usage has been above 80% for more than 2 minutes."

      - alert: HighContainerMemory
        expr: sum(container_memory_usage_bytes{name!=""}) > 4294967296
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High container memory usage"
          description: "Total container memory usage is above 4 GB for more than 2 minutes."

      - alert: ContainerMonitoringUnavailable
        expr: absent(container_last_seen)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container monitoring unavailable"
          description: "cAdvisor container metrics are unavailable."